name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines: ^22.19 || >=24 — every supported OS runs the newest line,
        # plus the lowest supported line on Linux only (4 jobs total). The
        # launcher chains are platform-specific, so a single-OS matrix could
        # not catch a regression on macOS/Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:manifest
      # lib/ is a gitignored build product — pack:verify needs the build first.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:verify
